<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.5" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2238" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00f0ff" opacity="0.03"/>
    </pattern>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="180" cy="60" r="240" fill="url(#glow1)"/>
  <circle cx="1040" cy="300" r="260" fill="url(#glow2)"/>
  <circle cx="620" cy="180" r="200" fill="url(#glow3)"/>

  <!-- 扫描线 -->
  <rect width="1200" height="340" fill="url(#scan)"/>

  <!-- 外框 -->
  <rect x="10" y="10" width="1180" height="320" rx="16" stroke="url(#neon)" stroke-width="1.4" opacity="0.55"/>
  <rect x="10" y="10" width="1180" height="320" rx="16" stroke="url(#neon)" stroke-width="4" opacity="0.12" filter="url(#blurGlow)"/>

  <!-- 四角装饰 -->
  <path d="M 34 34 L 34 22 L 90 22" stroke="#00f0ff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 1166 34 L 1166 22 L 1110 22" stroke="#ff2d95" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 34 306 L 34 318 L 90 318" stroke="#7b61ff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 1166 306 L 1166 318 L 1110 318" stroke="#00f0ff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 顶部状态栏 -->
  <text x="48" y="62" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#3d4d6b" letter-spacing="3">STATUS: ONLINE</text>
  <circle cx="196" cy="58" r="3.5" fill="#00ff9d">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1152" y="62" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#3d4d6b" letter-spacing="3">SYS.VER 2026</text>

  <!-- 主标题 -->
  <g>
    <text x="600" y="158" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="url(#neon2)" letter-spacing="1">SHEN YICONG</text>
    <text x="600" y="158" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="url(#neon2)" letter-spacing="1" opacity="0.5" filter="url(#blurGlow)">SHEN YICONG</text>
  </g>

  <!-- 中文名 -->
  <text x="600" y="200" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#7d8ba8" letter-spacing="14">沈 奕 聪</text>

  <!-- 分隔线 -->
  <line x1="380" y1="224" x2="820" y2="224" stroke="url(#neon)" stroke-width="1" opacity="0.6"/>
  <circle cx="600" cy="224" r="3" fill="#00f0ff"/>

  <!-- 副标题 / 打字机 -->
  <text x="600" y="262" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#00f0ff" letter-spacing="1.5">
    <tspan>&lt; Embedded · Data · Web &#47;&gt;</tspan>
  </text>

  <!-- 底部标签 -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="10" letter-spacing="2">
    <rect x="424" y="284" width="104" height="24" rx="12" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
    <text x="476" y="300" text-anchor="middle" fill="#00f0ff" opacity="0.95">AT89C51</text>
    <rect x="544" y="284" width="112" height="24" rx="12" fill="none" stroke="#7b61ff" stroke-width="1" opacity="0.5"/>
    <text x="600" y="300" text-anchor="middle" fill="#a78bfa" opacity="0.95">PYTHON</text>
    <rect x="672" y="284" width="104" height="24" rx="12" fill="none" stroke="#ff2d95" stroke-width="1" opacity="0.5"/>
    <text x="724" y="300" text-anchor="middle" fill="#ff2d95" opacity="0.95">WEB</text>
  </g>
</svg>
